# ============================================================================
# Netlify deployment.
#
# Netlify Free is used deliberately: its terms explicitly permit commercial
# use, where Vercel's Hobby plan does not — and Hobby additionally caps cron
# jobs at once per day, which cannot run this product's hourly session
# reminders or 15-minute delivery retries.
#
# Scheduling does not live here regardless: pg_cron runs inside Supabase, next
# to the data, and calls the /api/jobs/* handlers (ADR-3).
# ============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # @supabase/supabase-js requires Node >= 22; Node 20 is EOL and its missing
  # global WebSocket makes realtime-js throw at import.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

  # Netlify's secrets scanner fails the build when an environment variable's
  # value appears in the build output. Next inlines every NEXT_PUBLIC_* value
  # into the client bundle by design, so these two always will — and they are
  # meant to be public: the URL is in every request, and the publishable key
  # is what the browser authenticates with. Row-level security is what stops
  # it reading anything, not its secrecy.
  #
  # SUPABASE_SERVICE_ROLE_KEY is deliberately NOT listed. It must never reach
  # the bundle, and leaving it scanned means the build fails loudly if it ever
  # does.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Deploy previews and branch builds must never point at production Supabase.
# Set NEXT_PUBLIC_SUPABASE_URL for these contexts in the Netlify UI.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ── security headers ────────────────────────────────────────────────────────
#
# The real set lives in next.config.ts, NOT here. These [[headers]] rules only
# reach assets Netlify's CDN serves directly; every page goes through the
# Next.js function, and function responses do not get them. The first deploy
# proved it — /login came back with no X-Frame-Options while the CSS beside it
# had all four, which is precisely backwards: the page is the framable thing.
#
# What remains below covers static assets, which the Next config cannot reach
# for the same reason in reverse. Keep the two in step.
#
# Strict-Transport-Security is Netlify's own (it sends it with preload), so it
# is set in neither place.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
